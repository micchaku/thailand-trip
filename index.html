<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベトナム・タイ（北部・南部離島）周遊ルートマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; background: #0f172a; color: #e0e0e0; }
#map { width: 100%; height: 60vh; min-height: 380px; }

.panel { padding: 20px 24px; max-width: 960px; margin: 0 auto; }
.panel h1 { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
.panel .subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }

/* Timeline */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 12px; top: 8px; bottom: 8px;
  width: 2px; background: linear-gradient(180deg, #ec4899, #f59e0b, #f97316, #10b981, #3b82f6, #06b6d4, #8b5cf6, #d946ef);
}
.tl-item { position: relative; padding: 0 0 20px 20px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot {
  position: absolute; left: -22px; top: 4px;
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--c); background: #0f172a; z-index: 1;
}
.tl-dot.filled { background: var(--c); }
.tl-header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tl-place { font-weight: 700; font-size: 1rem; color: #fff; }
.tl-dates { font-size: 0.8rem; color: #94a3b8; }
.tl-stay { font-size: 0.8rem; color: var(--c); font-weight: 700; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; }

.tl-transport {
  margin-top: 6px; padding: 8px 12px; border-radius: 8px;
  background: rgba(255,255,255,0.04); border-left: 3px solid var(--tc);
  font-size: 0.82rem; line-height: 1.6;
}
.tl-transport .mode {
  display: inline-block; font-size: 0.7rem; font-weight: 600;
  padding: 1px 6px; border-radius: 4px; margin-right: 4px;
  color: #fff; background: var(--tc);
}
.tl-transport .detail { color: #cbd5e1; }
.tl-transport .sub { color: #64748b; font-size: 0.78rem; }

/* Legend */
.legend-bar { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
.leg { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: #94a3b8; }
.leg-line { width: 20px; height: 3px; border-radius: 2px; }
.leg-line.dashed { background: repeating-linear-gradient(90deg, var(--lc) 0 6px, transparent 6px 10px); height: 2px; }

/* Leaflet overrides */
.custom-popup .leaflet-popup-content-wrapper {
  background: #1e293b; color: #e2e8f0; border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08);
}
.custom-popup .leaflet-popup-tip { background: #1e293b; }
.custom-popup .leaflet-popup-content { margin: 10px 14px; font-size: 13px; line-height: 1.6; }
.custom-popup .leaflet-popup-content strong { color: #fff; }
</style>
</head>
<body>

<div id="map"></div>
<div class="panel">
  <h1>羽田発着 ベトナム・タイ（北部＆南部離島）縦断ルート</h1>
  <p class="subtitle">1月2日〜1月23日（21泊22日）｜滞在期間・宿泊数明記プラン</p>
  <div class="timeline" id="timeline"></div>
  <div class="legend-bar">
    <div class="leg"><div class="leg-line dashed" style="--lc:#f472b6"></div> 国際・国内フライト</div>
    <div class="leg"><div class="leg-line" style="--lc:#f97316; background:var(--lc)"></div> 夜行列車</div>
    <div class="leg"><div class="leg-line dashed" style="--lc:#06b6d4"></div> フェリー／ボート</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

// ===== DATA =====
const places = [
  { id:"haneda", name:"羽田空港", en:"Haneda Airport", lat:35.5494, lng:139.7798,
    sub:"日本発着拠点", dates:"1/2 発 / 1/23 帰国", stay:"", color:"#e11d48", type:"main" },

  { id:"hcmc", name:"ホーチミン", en:"Ho Chi Minh City", lat:10.8231, lng:106.6297,
    sub:"ベトナム（滞在＆経由）", dates:"1/2〜1/5", stay:"3泊4日",
    popExtra:"絶品グルメとコロニアル街歩き", color:"#f59e0b", type:"main" },

  { id:"bangkok", name:"バンコク", en:"Bangkok", lat:13.7563, lng:100.5018,
    sub:"クルンテープ・アピワット中央駅経由", dates:"1/5", stay:"（1泊 車中泊）",
    popExtra:"夜行列車乗り継ぎ拠点", color:"#f97316", type:"transit" },

  { id:"chiangmai", name:"チェンマイ", en:"Chiang Mai", lat:18.7883, lng:98.9853,
    sub:"タイ北部 古都", dates:"1/6〜1/10", stay:"4泊5日",
    popExtra:"カフェ巡り、寺院散策、ゆったり滞在", color:"#10b981", type:"main" },

  { id:"krabi", name:"クラビ", en:"Krabi", lat:8.0863, lng:98.9063,
    sub:"アオナン / ライレイビーチ", dates:"1/10〜1/13", stay:"3泊4日",
    popExtra:"ダイナミックな石灰岩の絶景", color:"#3b82f6", type:"main" },

  { id:"lanta", name:"ランタ島", en:"Koh Lanta", lat:7.6292, lng:99.0389,
    sub:"サラダン港着", dates:"1/13〜1/16", stay:"3泊4日",
    popExtra:"欧米人に人気の落ち着いた雰囲気の離島", color:"#06b6d4", type:"main" },

  { id:"phiphi", name:"ピピ島", en:"Koh Phi Phi", lat:7.7407, lng:98.7784,
    sub:"トンサイ港着", dates:"1/16〜1/19", stay:"3泊4日",
    popExtra:"マヤベイ＆透明度抜群のエメラルドグリーン海", color:"#8b5cf6", type:"main" },

  { id:"phuket", name:"プーケット", en:"Phuket", lat:7.8804, lng:98.3923,
    sub:"パトン / オールドタウン", dates:"1/19〜1/23", stay:"4泊5日",
    popExtra:"タイ最大のリゾート島で締めくくり", color:"#d946ef", type:"main" }
];

const segments = [
  { from:"haneda", to:"hcmc", color:"#f472b6", weight:2, dash:"6 8", curve:[[22.0, 125.0]] },
  { from:"hcmc", to:"bangkok", color:"#f472b6", weight:2, dash:"6 8" },
  { from:"bangkok", to:"chiangmai", color:"#f97316", weight:3, dash:null },
  { from:"chiangmai", to:"krabi", color:"#f472b6", weight:2, dash:"6 8", curve:[[13.0, 97.0]] },
  { from:"krabi", to:"lanta", color:"#06b6d4", weight:2.5, dash:"8 6" },
  { from:"lanta", to:"phiphi", color:"#06b6d4", weight:2.5, dash:"8 6" },
  { from:"phiphi", to:"phuket", color:"#06b6d4", weight:2.5, dash:"8 6" },
  { from:"phuket", to:"hcmc", color:"#f472b6", weight:2, dash:"6 8" },
  { from:"hcmc", to:"haneda", color:"#f472b6", weight:2, dash:"6 8", curve:[[22.0, 125.0]] }
];

const timeline = [
  { place:"羽田空港 → ホーチミン", dates:"1月2日",
    stay:null, color:"#e11d48", filled:true,
    transport:{ mode:"フライト", modeColor:"#f472b6",
      text:"羽田空港 ➔ タンソンニャット国際空港（ホーチミン）",
      sub:"直行便でベトナムへ移動" }},

  { place:"ホーチミン（ベトナム）", dates:"1月2日〜1月5日",
    stay:"3泊4日", color:"#f59e0b", filled:true,
    transport:{ mode:"フライト", modeColor:"#f472b6",
      text:"ホーチミン ➔ バンコク（スワンナプーム/ドンムアン）",
      sub:"1/5 昼〜夕方のフライトでタイへ移動" }},

  { place:"バンコク（クルンテープ・アピワット中央駅）", dates:"1月5日 夜発",
    stay:"1泊（車中泊）", color:"#f97316", filled:true,
    transport:{ mode:"夜行列車", modeColor:"#f97316",
      text:"北部本線 特急・急行寝台列車 ➔ チェンマイ駅",
      sub:"夕方〜夜発 ➔ 翌朝チェンマイ着（約11〜13時間）｜1・2等エアコン寝台推奨" }},

  { place:"チェンマイ（タイ北部）", dates:"1月6日〜1月10日",
    stay:"4泊5日", color:"#10b981", filled:true,
    transport:{ mode:"フライト", modeColor:"#f472b6",
      text:"チェンマイ空港（CNX）➔ クラビ空港（KBV）",
      sub:"直行便フライト（AirAsia等）で南部のビーチエリアへ一気に移動（約2時間）" }},

  { place:"クラビ（Krabi）", dates:"1月10日〜1月13日",
    stay:"3泊4日", color:"#3b82f6", filled:true,
    transport:{ mode:"船・フェリー", modeColor:"#06b6d4",
      text:"クラビ（クラビタウン/アオナン）➔ ランタ島（Saladan Pier）",
      sub:"フェリーまたはスピードボート（約2〜2.5時間）" }},

  { place:"ランタ島（Koh Lanta）", dates:"1月13日〜1月16日",
    stay:"3泊4日", color:"#06b6d4", filled:true,
    transport:{ mode:"船・フェリー", modeColor:"#06b6d4",
      text:"ランタ島（Saladan Pier）➔ ピピ島（Tonsai Pier）",
      sub:"高速船/スピードボート（約1〜1.5時間）" }},

  { place:"ピピ島（Koh Phi Phi）", dates:"1月16日〜1月19日",
    stay:"3泊4日", color:"#8b5cf6", filled:true,
    transport:{ mode:"船・フェリー", modeColor:"#06b6d4",
      text:"ピピ島（Tonsai Pier）➔ プーケット（Rassada Pier）",
      sub:"大型フェリーまたはスピードボート（約1.5〜2時間）" }},

  { place:"プーケット（Phuket）", dates:"1月19日〜1月23日",
    stay:"4泊5日", color:"#d946ef", filled:true,
    transport:{ mode:"フライト", modeColor:"#f472b6",
      text:"プーケット国際空港（HKT）➔ ホーチミン（SGN）経由 ➔ 羽田空港",
      sub:"1/23 プーケット発、ホーチミン乗り継ぎで日本帰国" }},

  { place:"羽田空港 到着", dates:"1月23日〜24日",
    stay:null, color:"#e11d48", filled:true, transport:null }
];


// ===== MAP RENDERING =====
const map = L.map('map', { zoomControl: true, scrollWheelZoom: true });

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18
}).addTo(map);

const byId = id => places.find(p => p.id === id);

// Draw polyline segments
segments.forEach(seg => {
  const f = byId(seg.from), t = byId(seg.to);
  const pts = [[f.lat, f.lng], ...(seg.curve || []), [t.lat, t.lng]];
  L.polyline(pts, {
    color: seg.color, weight: seg.weight, opacity: 0.75,
    dashArray: seg.dash, smoothFactor: 1.5
  }).addTo(map);
});

// Fit map view to SE Asia region
const seaPoints = places.filter(p => p.id !== 'haneda').map(p => [p.lat, p.lng]);
map.fitBounds(seaPoints, { padding: [40, 40] });

function mainIcon(label, color) {
  return L.divIcon({ className: '', iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -20],
    html: '<div style="width:34px;height:34px;border-radius:50%;background:'+color+
      ';display:flex;align-items:center;justify-content:center;'+
      'font-size:12px;font-weight:800;color:#fff;'+
      'box-shadow:0 2px 10px '+color+'66;border:2.5px solid rgba(255,255,255,0.35);">'+label+'</div>' });
}

let mainIdx = 1;
places.forEach(p => {
  let icon = mainIcon(p.type === 'transit' ? '🚂' : (p.id === 'haneda' ? '✈️' : mainIdx++), p.color);
  let popupHtml = '<strong>'+p.name+'（'+p.en+'）</strong>';
  if (p.dates) popupHtml += '<br>'+p.dates;
  if (p.stay) popupHtml += ' <span style="color:'+p.color+';font-weight:700">［'+p.stay+'］</span>';
  if (p.popExtra) popupHtml += '<br><span style="color:#94a3b8;font-size:12px">'+p.popExtra+'</span>';

  L.marker([p.lat, p.lng], { icon: icon }).addTo(map)
    .bindPopup(popupHtml, { className: 'custom-popup' });
});


// ===== TIMELINE PANEL =====
const tlEl = document.getElementById('timeline');
timeline.forEach(function(t) {
  const item = document.createElement('div');
  item.className = 'tl-item';
  item.style.setProperty('--c', t.color);

  let html = '<div class="tl-dot '+(t.filled ? 'filled' : '')+'" style="--c:'+t.color+'"></div>';
  html += '<div class="tl-header">';
  html += '<span class="tl-place">'+t.place+'</span>';
  html += '<span class="tl-dates">'+t.dates+'</span>';
  if (t.stay) html += '<span class="tl-stay">'+t.stay+'</span>';
  html += '</div>';

  if (t.transport) {
    html += '<div class="tl-transport" style="--tc:'+t.transport.modeColor+'">';
    html += '<span class="mode">'+t.transport.mode+'</span>';
    html += '<span class="detail">'+t.transport.text+'</span>';
    html += '<br><span class="sub">'+t.transport.sub+'</span>';
    html += '</div>';
  }
  item.innerHTML = html;
  tlEl.appendChild(item);
});

</script>
</body>
</html>

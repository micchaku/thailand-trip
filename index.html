<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>東南アジア旅行 2027</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#0f172a;color:#e2e8f0;overflow:hidden}
#map{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#panel{position:fixed;top:0;right:0;width:370px;height:100%;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);z-index:1000;overflow-y:auto;border-left:1px solid rgba(148,163,184,.15);transition:transform .3s}
#panel.hide{transform:translateX(100%)}
#toggle{position:fixed;top:12px;right:380px;z-index:1001;background:rgba(15,23,42,.85);border:1px solid rgba(148,163,184,.25);color:#e2e8f0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;backdrop-filter:blur(8px);transition:right .3s}
#toggle.shifted{right:12px}
.hdr{padding:20px 20px 10px;border-bottom:1px solid rgba(148,163,184,.12)}
.hdr h1{font-size:18px;font-weight:700;color:#f8fafc;margin-bottom:2px}
.hdr p{font-size:12px;color:#94a3b8}
.tl{padding:12px 20px 20px}
.ti{display:flex;gap:12px;position:relative;padding-bottom:6px}
.ti:not(:last-child)::before{content:'';position:absolute;left:17px;top:38px;bottom:0;width:2px;background:rgba(148,163,184,.18)}
.dot{width:36px;height:36px;min-width:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;margin-top:2px;position:relative;z-index:2}
.dot.outline{background:transparent !important;border:2.5px solid}
.info{flex:1;min-width:0}
.info .nm{font-size:15px;font-weight:600;color:#f1f5f9}
.info .dt{font-size:12px;color:#94a3b8;margin-top:1px}
.info .st{font-size:12px;color:#cbd5e1;margin-top:1px}
.tr{margin:6px 0 10px;padding:6px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px}
.tr .ic{font-size:15px}
.legend{padding:16px 20px;border-top:1px solid rgba(148,163,184,.12)}
.legend h3{font-size:13px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.lg{display:flex;flex-wrap:wrap;gap:8px}
.lg span{display:flex;align-items:center;gap:5px;font-size:12px;color:#cbd5e1}
.lg i{width:14px;height:4px;border-radius:2px;display:inline-block}
.leaflet-popup-content-wrapper{background:rgba(15,23,42,.95)!important;color:#e2e8f0!important;border-radius:10px!important;border:1px solid rgba(148,163,184,.2)!important;box-shadow:0 8px 32px rgba(0,0,0,.5)!important}
.leaflet-popup-tip{background:rgba(15,23,42,.95)!important}
.leaflet-popup-content{margin:12px 16px!important;font-size:14px;line-height:1.5}
.leaflet-popup-content strong{font-size:16px;color:#f8fafc}
.leaflet-popup-content .sub{color:#94a3b8;font-size:12px;margin-top:4px}
.leaflet-popup-content .det{margin-top:6px;font-size:13px;color:#cbd5e1}
@media(max-width:600px){
  #panel{width:100%;border-left:none}
  #toggle{right:12px}
  #toggle.shifted{right:12px}
  .hdr h1{font-size:16px}
}
</style>
</head>
<body>
<div id="map"></div>
<button id="toggle" onclick="togglePanel()">📋</button>
<div id="panel">
  <div class="hdr">
    <h1>🌏 東南アジア周遊 2027</h1>
    <p>2027年1月2日〜1月24日着（21泊22日）</p>
  </div>
  <div class="tl" id="timeline"></div>
  <div class="legend">
    <h3>移動手段</h3>
    <div class="lg">
      <span><i style="background:#f472b6"></i>飛行機</span>
      <span><i style="background:#f97316"></i>夜行列車</span>
      <span><i style="background:#10b981"></i>長距離バス／バン</span>
      <span><i style="background:#06b6d4"></i>フェリー／ボート</span>
    </div>
  </div>
</div>

<script>
// === データ定義（スクリーンショットの旅程に完全準拠）===
var places = [
  {id:'haneda',   name:'羽田空港',     lat:35.5494, lng:139.7798, color:'#a78bfa', type:'airport',
   dates:'1/2 出発 → 1/24 帰国', popExtra:'出発・帰国空港'},
  {id:'hcmc',     name:'ホーチミン',   lat:10.8231, lng:106.6297, color:'#f472b6', type:'city',
   dates:'1/2〜1/5（3泊）/ 1/23 乗継', popExtra:'ベンタイン市場・戦争証跡博物館・フォーやバインミー'},
  {id:'bangkok',  name:'バンコク',     lat:13.7563, lng:100.5018, color:'#fbbf24', type:'city',
   dates:'1/5 トランジット / 1/10 トランジット', popExtra:'乗継拠点（夜行列車・長距離バス）'},
  {id:'chiangmai',name:'チェンマイ',   lat:18.7883, lng:98.9853,  color:'#fb923c', type:'city',
   dates:'1/6〜1/10（4泊）', popExtra:'旧市街寺院巡り・ナイトバザール・象保護施設'},
  {id:'krabi',    name:'クラビ',       lat:8.0863,  lng:98.9063,  color:'#34d399', type:'city',
   dates:'1/11〜1/14（3泊）', popExtra:'アオナンビーチ・タイガーケーブ寺院・周辺観光'},
  {id:'lanta',    name:'ランタ島',     lat:7.5407,  lng:99.0452,  color:'#2dd4bf', type:'island',
   dates:'1/14〜1/17（3泊）', popExtra:'ロングビーチ・旧市街・シュノーケリング'},
  {id:'phiphi',   name:'ピピ島',       lat:7.7407,  lng:98.7784,  color:'#22d3ee', type:'island',
   dates:'1/17〜1/20（3泊）', popExtra:'トンサイベイ周辺・ロングビーチ周辺'},
  {id:'phuket',   name:'プーケット',   lat:7.8804,  lng:98.3923,  color:'#60a5fa', type:'city',
   dates:'1/20〜1/23（3泊）', popExtra:'パトンビーチまたはオールドタウン周辺'}
];

var segments = [
  {from:'haneda',  to:'hcmc',     color:'#f472b6', weight:2.5, dash:'8,6'},
  {from:'hcmc',    to:'bangkok',  color:'#f472b6', weight:2.5, dash:'8,6'},
  {from:'bangkok', to:'chiangmai',color:'#f97316', weight:3,   dash:null},
  {from:'chiangmai',to:'bangkok', color:'#f472b6', weight:2.5, dash:'8,6'},
  {from:'bangkok', to:'krabi',    color:'#10b981', weight:2.5, dash:null},
  {from:'krabi',   to:'lanta',    color:'#06b6d4', weight:2.5, dash:'6,4'},
  {from:'lanta',   to:'phiphi',   color:'#06b6d4', weight:2.5, dash:'6,4'},
  {from:'phiphi',  to:'phuket',   color:'#06b6d4', weight:2.5, dash:'6,4'},
  {from:'phuket',  to:'hcmc',     color:'#f472b6', weight:2.5, dash:'8,6'},
  {from:'hcmc',    to:'haneda',   color:'#f472b6', weight:2.5, dash:'8,6'}
];

var timeline = [
  {place:'羽田空港',   dates:'1/2（土）',     stay:'',            color:'#a78bfa', filled:false,
   transport:{text:'✈ JAL079便｜1/2 01:25発 → 05:50着（ホーチミン）', bg:'rgba(244,114,182,.15)', fg:'#f472b6'}},
  {place:'ホーチミン', dates:'1/2〜1/5',      stay:'3泊',         color:'#f472b6', filled:true,
   transport:{text:'✈ 飛行機でバンコクへ', bg:'rgba(244,114,182,.15)', fg:'#f472b6'}},
  {place:'バンコク',   dates:'1/5（火）',     stay:'トランジット', color:'#fbbf24', filled:false,
   transport:{text:'🚂 夜行列車でチェンマイへ（約13時間）', bg:'rgba(249,115,22,.15)', fg:'#f97316'}},
  {place:'チェンマイ', dates:'1/6〜1/10',     stay:'4泊',         color:'#fb923c', filled:true,
   transport:{text:'✈ 飛行機でバンコクへ', bg:'rgba(244,114,182,.15)', fg:'#f472b6'}},
  {place:'バンコク',   dates:'1/10（日）',    stay:'トランジット', color:'#fbbf24', filled:false,
   transport:{text:'🚌 長距離バスでクラビへ（夜行）', bg:'rgba(16,185,129,.15)', fg:'#10b981'}},
  {place:'クラビ',     dates:'1/11〜1/14',    stay:'3泊',         color:'#34d399', filled:true,
   transport:{text:'⛴ フェリーでランタ島へ', bg:'rgba(6,182,212,.15)', fg:'#06b6d4'}},
  {place:'ランタ島',   dates:'1/14〜1/17',    stay:'3泊',         color:'#2dd4bf', filled:true,
   transport:{text:'⛴ スピードボートでピピ島へ', bg:'rgba(6,182,212,.15)', fg:'#06b6d4'}},
  {place:'ピピ島',     dates:'1/17〜1/20',    stay:'3泊',         color:'#22d3ee', filled:true,
   transport:{text:'⛴ 大型船でプーケットへ', bg:'rgba(6,182,212,.15)', fg:'#06b6d4'}},
  {place:'プーケット', dates:'1/20〜1/23',    stay:'3泊',         color:'#60a5fa', filled:true,
   transport:{text:'✈ VN620便｜1/23 18:50発 → 20:55着（ホーチミン）', bg:'rgba(244,114,182,.15)', fg:'#f472b6'}},
  {place:'ホーチミン', dates:'1/23',            stay:'乗継',        color:'#f472b6', filled:false,
   transport:{text:'✈ JAL070便｜1/23 23:45発 → 1/24 06:50着（羽田）', bg:'rgba(244,114,182,.15)', fg:'#f472b6'}},
  {place:'羽田空港',   dates:'1/24（土）06:50着', stay:'帰国',    color:'#a78bfa', filled:false, transport:null}
];

// === 地図初期化 ===
var map = L.map('map',{zoomControl:false}).setView([13.5,102],5);
L.control.zoom({position:'bottomleft'}).addTo(map);

L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=ja&x={x}&y={y}&z={z}',{
  attribution:'Map data &copy; Google',
  subdomains:'0123',
  maxZoom:20
}).addTo(map);

// === マーカー配置 ===
var placeMap = {};
places.forEach(function(p){placeMap[p.id]=p;});

var icons = {airport:'✈️', city:'📍', island:'🏝️'};
places.forEach(function(p,i){
  var iconHtml = '<div style="width:38px;height:38px;border-radius:50%;'
    +'background:'+p.color+';display:flex;align-items:center;justify-content:center;'
    +'font-size:18px;box-shadow:0 2px 12px '+p.color+'66;border:2px solid rgba(255,255,255,.3)">'
    +(icons[p.type]||'📍')+'</div>';
  var mk = L.marker([p.lat,p.lng],{
    icon:L.divIcon({className:'',html:iconHtml,iconSize:[38,38],iconAnchor:[19,19]})
  }).addTo(map);

  var popup = '<strong>'+p.name+'</strong>'
    +'<div class="sub">'+p.dates+'</div>';
  if(p.popExtra) popup+='<div class="det">'+p.popExtra+'</div>';
  mk.bindPopup(popup);
});

// === ルート線 ===
segments.forEach(function(s){
  var a=placeMap[s.from], b=placeMap[s.to];
  if(!a||!b) return;

  var pts;
  var dist = Math.sqrt(Math.pow(a.lat-b.lat,2)+Math.pow(a.lng-b.lng,2));
  if(dist>8){
    var midLat=(a.lat+b.lat)/2, midLng=(a.lng+b.lng)/2;
    var dx=b.lng-a.lng, dy=b.lat-a.lat;
    midLat+=Math.abs(dx)*0.08; midLng-=dy*0.08;
    pts=[];
    for(var t=0;t<=1;t+=0.05){
      var lt=(1-t)*(1-t)*a.lat+2*(1-t)*t*midLat+t*t*b.lat;
      var ln=(1-t)*(1-t)*a.lng+2*(1-t)*t*midLng+t*t*b.lng;
      pts.push([lt,ln]);
    }
  } else {
    pts=[[a.lat,a.lng],[b.lat,b.lng]];
  }

  L.polyline(pts,{
    color:s.color, weight:s.weight, opacity:0.7,
    dashArray:s.dash||null
  }).addTo(map);
});

// === タイムライン生成 ===
var tlEl = document.getElementById('timeline');
timeline.forEach(function(t,i){
  var html='<div class="ti">';
  var dotStyle = t.filled
    ? 'background:'+t.color
    : 'border-color:'+t.color;
  html+='<div class="dot '+(t.filled?'':'outline')+'" style="'+dotStyle+'">'
    +(i+1)+'</div>';
  html+='<div class="info">';
  html+='<div class="nm">'+t.place+'</div>';
  html+='<div class="dt">'+t.dates+(t.stay?' ／ '+t.stay:'')+'</div>';
  if(t.transport){
    html+='<div class="tr" style="background:'+t.transport.bg+';color:'+t.transport.fg+'">';
    html+=t.transport.text+'</div>';
  }
  html+='</div></div>';
  tlEl.innerHTML+=html;
});

// === パネル開閉 ===
function togglePanel(){
  var p=document.getElementById('panel');
  var b=document.getElementById('toggle');
  p.classList.toggle('hide');
  b.classList.toggle('shifted');
}

// === 地図範囲をルート全体にフィット ===
var bounds = L.latLngBounds(places.map(function(p){return[p.lat,p.lng];}));
map.fitBounds(bounds,{padding:[40,40]});
</script>
</body>
</html>
